# alsoft.conf -- OpenAL-soft configuration for the mkxp-z Vita player.
# Packed to app0:/alsoft.conf by
# vita/scripts/package-vpk.sh.
#
# Every fact below was read out of openal-soft 1.19.1 (rebuilt with the Vita
# backend patch by vita/scripts/build-vita-deps.sh) and out of psp2/audioout.h,
# not assumed.
#
# WHERE OPENAL LOOKS. ReadALConfig() walks exactly two paths and stops at the
# FIRST one it can fopen:
#
#     1. app0:/alsoft.conf                <- this file
#     2. ux0:/data/openal/alsoft.conf
#
# First wins; it is not a merge, and there is no override layer. Because this
# file ships inside the VPK, the ux0 path is never reached on an installed
# player. Retuning on the device therefore means editing THIS file in place --
# it lands at ux0:app/<TITLE_ID>/alsoft.conf, which VitaShell can edit -- or
# deleting it so the ux0 path takes over. Either way, no rebuild: that is the
# whole reason these numbers live here and not in the attrs[] array mkxp-z
# hands to alcCreateContext (src/main.cpp).
#
# GRAMMAR (LoadConfigFromFile, same library):
#   - trailing whitespace is stripped from the line, then everything from the
#     first '#' onwards is dropped -- a comment may start anywhere;
#   - "key = value", "key=value" and "key   =   value" all parse. The KEY is
#     then trimmed of trailing whitespace; the VALUE is NOT. So a trailing
#     comment would leave "stereo   " in a string value and fail the
#     comparison that reads it. Every comment here is on its own line for
#     exactly that reason -- do not move one onto a key line.
#   - [general] is the section every key below belongs to.
#   - An unknown key is simply never read. A bad value is reported by OpenAL
#     itself ("AL lib: ... Unsupported channels: ..."). To see those, and the
#     line naming which config file was loaded, and one line per key found,
#     create ux0:/data/mkxp-z/audio-telemetry.enabled: the player then sets
#     ALSOFT_LOGLEVEL=3 before opening the device.
#
# WHAT THE VITA BACKEND DOES WITH THESE (ALCvitaPlayback, same library):
#   - device open forces the sample type to int16 whatever sample-type says,
#     and coerces any channel configuration that is not mono or stereo to
#     stereo;
#   - open and reset round period_size UP to a multiple of 64 and pass it to
#     sceAudioOutOpenPort as the grain, with frequency as the rate, mono or
#     stereo as the mode, on port type BGM;
#   - psp2/audioout.h: that grain must be 64..65472 in steps of 64 and the
#     frequency one of 8000, 11025, 12000, 16000, 22050, 24000, 32000, 44100,
#     48000. Outside those the port open fails, which is no audio at all --
#     so treat the two numbers below as a pair that has to stay legal.
#
# WHAT IS A CHANGE AND WHAT IS A DESCRIPTION. alcOpenDevice builds every new
# device from one literal pool, and it reads: frequency 44100, period_size
# 1024, periods 3, channels stereo, sample-type float32, sources 256. So of the
# eight keys below, four -- frequency, period_size, periods, channels -- write
# down exactly what OpenAL would have chosen anyway; sample-type writes down
# what the Vita backend overrides it to regardless; and three are deliberate
# changes, each argued at the key itself: sources (down from 256), hrtf (stock
# leaves the decision to the driver) and dither (stock is on).
#
# So this file is mostly a description that happens also to be a pin. Its point
# is that all eight numbers are now visible, tunable and reported instead of
# implicit -- with the one boot line the player emits reporting what the device
# actually ended up with.

[general]

# Output rate handed to sceAudioOutOpenPort. 44100 is OpenAL's default and the
# rate most RGSS BGM/SE assets are authored at, so the resampler has nothing to
# do for them. Must be one of the nine rates audioout.h lists.
frequency = 44100

# Samples per mixer period. After the backend rounds it up to a multiple of 64
# this IS the sceAudioOut grain -- and 1024 already is a multiple of 64, so it
# is passed through unchanged. 1024 / 44100 is about 23 ms of audio per
# sceAudioOutOutput call. Lower it for latency at the cost of waking the mixer
# thread more often; raise it if a hardware log shows the mixer starving.
period_size = 1024

# Periods, which OpenAL calls NumUpdates. The Vita backend keeps exactly one
# period buffer and blocks in sceAudioOutOutput, which does its own buffering,
# so this does not change how much audio is queued here: it is what OpenAL
# reports (the "Post-reset: ... x3" trace line) and what a backend that queued
# its own periods would honour. 3 is the value alcOpenDevice starts every
# device with, so this line changes nothing; it is here to be findable.
periods = 3

# Voices OpenAL allocates state for. Stock is 256. The engine claims nine --
# one per BGM track (BGMTrackCount defaults to 1), one for BGS, one for ME and
# SESourceCount (6) for sound effects -- so the other 247 are mixer bookkeeping
# for voices that can never sound, on a console whose newlib heap is already
# shared with the CPU bitmap backend. 32 keeps a wide margin over nine and
# still leaves room for a game that raises BGMTrackCount or SESourceCount.
sources = 32

# Output channel configuration. The Vita backend coerces anything that is not
# mono or stereo to stereo, so this is the honest name for what it does.
channels = stereo

# Output sample format. The backend overrides this to int16 at device open --
# sceAudioOut has no other output format -- so this is written to match what
# actually happens, not to change it.
sample-type = int16

# HRTF is head-related-transfer-function positional filtering; left unset,
# OpenAL decides for itself. mkxp-z already disables it per context
# (ALC_HRTF_SOFT, ALC_FALSE in src/main.cpp) because it degrades quality for
# non-positional audio (mkxp-z issue 341). Saying so here too means the device
# never builds the HRTF state in the first place rather than building it and
# then being told not to use it.
hrtf = false

# Dithering trades a little added noise for less quantisation distortion on the
# way down to int16, and OpenAL turns it ON by default. Off here: it costs
# mixer time per sample on a CPU that has none to spare, and RGSS material --
# already 16 bit, already mixed -- does not benefit enough to pay for it. Turn
# it back on if a hardware listen finds quantisation noise in quiet passages;
# that is a real trade, not a mistake.
dither = false
