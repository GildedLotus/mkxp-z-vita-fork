# SPDX-License-Identifier: GPL-3.0-or-later
# Meson cross file: arm-vita-eabi (PS Vita homebrew / VitaSDK).
#
# Used by vita/scripts/configure-vita.sh. Source vita/scripts/vita-env.sh first
# so $VITASDK/bin is on PATH and arm-vita-eabi-pkg-config can resolve libs.
#
# host_machine.system remains 'linux' for the portable dependency/toolchain
# conventions. Vita is newlib/ELF; this selects Meson behavior, not the OS.

[binaries]
c = 'arm-vita-eabi-gcc'
cpp = 'arm-vita-eabi-g++'
ar = 'arm-vita-eabi-ar'
strip = 'arm-vita-eabi-strip'
# Wrapper at $VITASDK/bin; pins PKG_CONFIG_LIBDIR to the Vita sysroot and
# passes --define-prefix --static so ${VITASDK} in vdpm .pc files resolves.
pkg-config = 'arm-vita-eabi-pkg-config'
cmake = 'cmake'

[properties]
# Vita ELFs cannot run on the macOS build host.
needs_exe_wrapper = true
# pkg-config search path is owned by arm-vita-eabi-pkg-config (binaries.pkg-config
# above): it pins PKG_CONFIG_LIBDIR to $VITASDK/arm-vita-eabi/{lib,share}/pkgconfig
# and passes --define-prefix --static. Do not set pkg_config_libdir here.

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'cortex-a9'
endian = 'little'

[built-in options]
# VitaCPU: 4x Cortex-A9, NEON, hard-float.
c_args = ['-mcpu=cortex-a9', '-mfpu=neon', '-mfloat-abi=hard']
cpp_args = ['-mcpu=cortex-a9', '-mfpu=neon', '-mfloat-abi=hard']
c_link_args = ['-mcpu=cortex-a9', '-mfpu=neon', '-mfloat-abi=hard']
cpp_link_args = ['-mcpu=cortex-a9', '-mfpu=neon', '-mfloat-abi=hard']
# GCC 15 defaults to C23; bundled C (theoraplay, libnsgif) wants gnu11.
c_std = 'gnu11'
