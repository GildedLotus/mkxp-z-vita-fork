name: Player bug
description: A problem with the player itself (launcher, controls, audio, standby, settings) that isn't tied to one game.
labels: ["bug"]
body:
  - type: input
    id: player-version
    attributes:
      label: mkxp-z for PS Vita version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Attach `ux0:/data/mkxp-z/logs/mkxp-z.log` (or `launcher.log` for a launcher problem). **Do not attach `.psp2dmp` crash dumps**: they contain a copy of the process's memory.
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Vita model, firmware and storage (SD2Vita or official memory card), if you know them.
